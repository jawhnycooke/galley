# CI — the UNBYPASSABLE BACKSTOP. Runs on every PR into `dev` or `main`.
#
# Parity by construction: this job runs `just verify` — the EXACT recipe the
# pre-push git hook runs (see lefthook.yml + justfile). Same commands, same
# tools → if it passed locally on push, it passes here. The local hooks can be
# skipped (--no-verify, lefthook not installed); a required status check cannot.
#
# `just verify` for this repo is: fmt-check · lint · test -race · wasm · build ·
# cross-compile. The wasm client is embedded in the binary, so it is built
# before the build step rather than as a separate CI job.

name: CI

on:
  pull_request:
    branches: [dev, main]
  # Also run on pushes to dev/main so the base branch always has a fresh status
  # (required-check enforcement needs a passing run recorded on the base).
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      # Pinned, and pinned to the version developers run locally. `just verify`
      # is the same recipe here and on a laptop; a different linter MAJOR
      # version silently breaks that parity in the one place it matters most.
      # Bump this and the local install together.
      #
      # The install SCRIPT fetches the prebuilt binary; `go install` compiled it
      # from source every run (~95s). Same pinned version, ~10s. `just verify-go`
      # is still the only thing that RUNS the linter — this step only puts it on
      # PATH — so the parity the comment above is about is untouched.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The single source of truth — identical to the pre-push hook.
      - name: Verify (fmt-check + lint + test -race + wasm + build + cross)
        run: just verify-go

      # The editor bundle is COMMITTED (unlike galley.wasm, which every build
      # regenerates), so nothing in `just verify` notices when web/ changes and
      # the bundle does not. A stale bundle is invisible: the Go tests pass, the
      # binary builds, and the browser silently runs last week's editor.
      #
      # `just assets` rebuilds it from web/ and runs probe.mjs; the diff check
      # then fails if what it wrote differs from what is committed. Node is only
      # needed here and locally — never for a `go build` or a release.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # setup-node's `cache: npm` caches the DOWNLOAD cache (~/.npm), not
      # node_modules — so without this every run still extracts the 360-package
      # tree from scratch. Cache node_modules itself, keyed on the lockfile: a
      # hit means `_web-deps`'s `[ -d node_modules ]` guard skips `npm ci`
      # entirely; a lockfile change misses the key, leaves node_modules absent,
      # and the guard reinstalls. This is what makes the seven web recipes below
      # share one install instead of paying for it seven times.
      - name: Cache web/node_modules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # mermaid.js is diffed WITH the other two. `just assets` has always built
      # it and this step has always ignored it, so a stale mermaid bundle was
      # the one committed output nothing checked — and it is the output a page
      # only fetches when it holds a diagram, so nobody would have found it by
      # opening a document either.
      - name: Editor bundle is not stale
        run: |
          just assets
          git diff --exit-code -- internal/serve/assets/editor.js internal/serve/assets/editor.css \
            internal/serve/assets/mermaid.js \
            || { echo "::error::the committed editor bundle does not match web/ — run 'just assets' and commit the result"; exit 1; }

      # THE TYPECHECK, IN THE ONE JOB THAT ALREADY HAS NODE.
      #
      # It is NOT in `just verify` and must not be: that recipe is Go-only by
      # design, runs where node may not exist, and is what the release path
      # depends on. The half of the wire contract that belongs in `verify` is
      # the GENERATOR — internal/serve/wire_test.go, an ordinary Go test — and
      # it is already running in the step above this one.
      #
      # This is the other half: the browser modules that have opted in with
      # `// @ts-check` read web/wire.d.ts, so a Go struct renamed under them is
      # a red build here rather than a `TypeError: Cannot read properties of
      # undefined` in a gate nobody runs. `just types` is a pass-through to
      # web/package.json's `typecheck` script, whose flags live in
      # web/tsconfig.json — one spelling of the command, in the place npm
      # already looks for it.
      - name: The browser agrees with the wire
        run: just types

      # THE OTHER TWO THIRDS OF THE STACK, IN THE SAME JOB AND FOR THE SAME
      # REASON. `just verify` above gives every .go file gofmt, go vet and
      # golangci-lint; until this commit web/ had a type checker and nothing
      # else, over 14,500 lines of browser client and 17,000 of harness. These
      # are the format check and the linter, wired exactly like `just types`:
      # pass-throughs to web/package.json scripts whose configuration lives in
      # .prettierrc and web/eslint.config.mjs.
      #
      # They are cheap enough to sit beside the typecheck rather than in a job
      # of their own — measured on the full tree at 2.5s and 0.8s — and both
      # are already devDependencies of web/package.json, so the `npm install`
      # this job does for `just assets` has installed them by the time these
      # run.
      - name: web/ is formatted
        run: just fmt-web-check

      - name: web/ passes the linter
        run: just lint-web

      # web/.fallowrc.json's `entry` list must name real files — a stale entry
      # (a rename that outran the config) is otherwise a silent no-op: fallow
      # drops it from its own count and never says so. See the comment above
      # `check-entries` in the justfile for the defect this replaces.
      - name: fallow entry points exist
        run: just check-entries

      # A ceiling on the 14 functions that exceed a cognitive or cyclomatic
      # threshold — not fallow's headline 181, which is 92% an artifact of
      # having no coverage data. web/complexity-ratchet.py explains the
      # difference and why counting the wrong one punished a real refactor.
      # It was 16 until #143 broke up the five accreted functions; the bound
      # came down with the measurement.
      - name: Complexity has not regressed
        run: just complexity-ratchet

      # Ceilings on the two analyses that could otherwise grow in silence.
      # Their standing findings are named in the scripts, not just counted.
      - name: Dead code has not grown
        run: just dead-code-ratchet

      - name: Duplication has not grown
        run: just dupes-ratchet

  # THE BROWSER GATES, AND THIS JOB IS THE WHOLE REASON THEY ARE TRUSTWORTHY.
  #
  # `just verify` above opens no browser. It cannot: it is the recipe a release
  # runs and a `go build` machine must be able to run it. So everything this
  # product knows about PAINT, about nothing moving that was not clicked, about
  # the reviewer's hand never being tracked, and about two actors agreeing on
  # one file, lived in scripts that only ever ran when a human typed them.
  #
  # FOUR OF THE FIVE WERE DEAD FOR WEEKS AND EVERY GATE ANYONE RAN STAYED GREEN.
  # Two built their fixtures from `galley suggest`, deleted in 1cb6937; two read
  # `pending.suggestions`, a wire field that had become `instructions`. Nothing
  # noticed, because nothing ran them. That is not a testing gap — it is the
  # structural one, and this job is the fix for it.
  #
  # It is a SEPARATE job on purpose. It needs a chromium and several minutes,
  # and `verify` must stay the fast, browserless recipe the hook and the release
  # share. Failing here is a red PR; that is the point.
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Same node_modules cache as the ci job (see the comment there). A hit
      # skips the npm ci below; a lockfile change misses and reinstalls.
      - name: Cache web/node_modules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install web dependencies
        working-directory: web
        run: '[ -d node_modules ] || npm ci'

      # BOTH BROWSERS, AND THE SECOND ONE IS THE ONE THAT ACTUALLY RUNS.
      # `chromium.launch()` with no channel resolves to the HEADLESS SHELL, a
      # separate download from `chromium` — installing only the latter dies with
      # `Executable doesn't exist at .../chromium_headless_shell-1194/...`. This
      # job's first CI run failed exactly there while passing locally, because a
      # developer machine that has ever run `npx playwright install` already has
      # the shell cached. That asymmetry is the reason a gate belongs here and
      # not only in a habit.
      #
      # --with-deps because a bare install gives a browser whose shared
      # libraries this runner lacks; it then dies with no message a gate can
      # report.
      #
      # AND IT IS `playwright-core`'s OWN CLI, NOT `npx playwright`. This
      # package.json depends on playwright-core; `npx playwright` is a DIFFERENT
      # package, so npm fetches the latest one and installs the browser revision
      # THAT version wants. Two CI runs failed identically at revision 1194 —
      # the one core 1.56.1 asks for — while a newer playwright downloaded a
      # newer build beside it. The installer has to be the same version as the
      # library that launches, and the only way to guarantee that is to run the
      # library's own binary out of node_modules.
      - name: Install chromium
        working-directory: web
        run: node node_modules/playwright-core/cli.js install --with-deps chromium chromium-headless-shell

      # The gates spawn `bin/galley edit` against a real document. `just build`
      # and NOT `go build`: the wasm client is embedded, so a binary built
      # without it serves an error page instead of a review surface, and every
      # check would fail on a document that never rendered.
      - name: Build
        run: just build

      # ONE AT A TIME, and that is not caution — they bind fixed ports (8258 and
      # neighbours) and running two at once produces failures that look exactly
      # like regressions. Two agents lost time to that in one day.
      #
      # Each names what it protects, so a red check in the PR list says which
      # promise broke without anyone opening the log. That naming is why these
      # are three steps here and one `just gates` recipe locally — a known
      # second spelling of one list, stated in the recipe too. A fourth gate
      # goes in both places.
      - name: Gate — the round loop
        run: node web/rounds-ux.mjs
        env:
          GALLEY: ${{ github.workspace }}/bin/galley

      - name: Gate — the reviewer's hand is never tracked
        run: node web/typing.mjs
        env:
          GALLEY: ${{ github.workspace }}/bin/galley

      - name: Gate — two actors agree on the file
        run: node web/loop.mjs
        env:
          GALLEY: ${{ github.workspace }}/bin/galley

      # A PAGE SURVIVES THE LOOP, AND THE SHELL SURVIVES THE REVIEW. The
      # page-backed review: `galley edit index.html` derives content.md, the
      # agent revises it, and index.html re-renders with the reviewed sentence
      # in its wrapper and the shell it cannot carry (the <nav>, the terminal
      # <pre>) left verbatim. There are no screenshots: shell regions the review
      # cannot carry appear as ⟦ shell N ⟧ markers in content.md, so the gate
      # asserts the same shape here as on a laptop.
      - name: Gate — a page survives the loop
        run: node web/page.mjs
        env:
          GALLEY: ${{ github.workspace }}/bin/galley

      # A CODE BLOCK TAKES A BLOCK-LEVEL INSTRUCTION, AND ONLY FROM ITS OWN
      # GRIP. Hover a fence and a {} grip appears in the gutter; clicking it
      # opens the composer in BLOCK mode and sending files one block thread on
      # the fence's own key, with a card in the rail beside it — while a
      # SELECTION inside the fence still gets the deny line and no range
      # composer, which is the refusal this feature must not have weakened. It
      # then stops the server and reopens the document, because the note's
      # round trip is through the FILE and nothing else here reads it back.
      - name: Gate — a code block takes an instruction
        run: node web/codeblock.mjs
        env:
          GALLEY: ${{ github.workspace }}/bin/galley

      # THE CONTENT PANE ALIGNS TO THE LIVE PAGE, AND CLEARS OUTSIDE BOTH
      # VIEW. Page mode's Both view shows the same document twice, and the two
      # panes are made to read together at the section level: each content
      # heading is nudged DOWN by exactly the measured gap to the same heading
      # in the page iframe, never up, and never past 260px — the cap that
      # keeps the worst mismatch a short gap rather than a blank screen.
      # Content view leaves nothing behind, and Both re-measures. It is the
      # second gate that reads geometry, and unlike layers.mjs it is
      # platform-stable: every number is a threshold with slack, and both
      # sides of every comparison are measured in the same reading rather than
      # against a font.
      - name: Gate — the content pane aligns to the page
        run: node web/align.mjs
        env:
          GALLEY: ${{ github.workspace }}/bin/galley

      # A structural round removes a section and reloads the reviewer's live
      # editor at the round boundary — the cut stays cut and the round's words
      # survive a restructure. The only place the boundary reload is proven end
      # to end (real CLI + chromium + a simulated agent).
      - name: Gate — a structural round reloads the reviewer
        run: node web/livestructure.mjs
        env:
          GALLEY: ${{ github.workspace }}/bin/galley

      # UNDO SURVIVES A SERVER-SIDE MUTATION. It runs from `web/` because it
      # imports playwright-core the way the others do, and it carries its own
      # control — three undos with nothing filed — so a CI box that delivers
      # keystrokes differently fails the control rather than blaming the
      # product. It was a probe for exactly one day, while the defect it
      # measures was known and deliberately unfixed.
      - name: Gate — undo survives an instruction
        run: cd web && node ./undo.mjs
        env:
          GALLEY: ${{ github.workspace }}/bin/galley

      # `web/layers.mjs` IS DELIBERATELY NOT HERE YET, AND THAT IS NOT AN
      # OVERSIGHT — it is the one gate that measures PIXELS, and it is not
      # platform-stable. Two checks fail on a Linux runner and pass on a mac:
      #
      #   · "and they read as two words, not one" — the ghost's `margin-right`
      #     is `0.3em` (5.09px at 17px type) and the check compares it against a
      #     MEASURED space, which is 5.42px in the fallback font a runner with
      #     no SF fonts resolves to. An em-based margin can never satisfy
      #     `gap >= space` in a font whose space is wider than 0.3em, so the
      #     fragility is in the CHECK's threshold rather than in the product.
      #   · "the light survives a server-side mutation" — unverified; it may be
      #     timing on a slower machine, and it must be understood before it is
      #     adjusted.
      #
      # It is left OUT rather than made non-blocking. A gate that runs and
      # cannot fail is the shape this repository records six of and treats as
      # worse than no gate at all — and `continue-on-error` here would report
      # paint coverage nobody has. It stays a local gate (`node web/layers.mjs`,
      # 263 checks) until the two above are made font-independent, and then it
      # joins the three above it.
