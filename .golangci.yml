version: "2"

# THE LINTER SET FOR THE GO SIDE, AND WHY IT IS THIS ONE.
#
# There was no file here at all until this one: golangci-lint ran on its
# built-in defaults (errcheck, govet, ineffassign, staticcheck, unused), which
# is a thinner set than web/eslint.config.mjs enforces on the browser half —
# backwards for the core of the product. This file follows that config's own
# rule: every enabled linter is a named defect class, every declined one has a
# one-line reason, and every standing finding a new gate would otherwise fail
# on is named in a comment rather than fixed in the same change that adds the
# gate (see CLAUDE.md — a quality-stack change that also repairs things can't
# be reviewed; nobody can say which half did it).
#
# MEASURED, NOT ASSUMED. Every linter below — enabled or declined — was run
# with `--enable-only <name>` against this tree before the decision was made.
# The counts are in this file, and the full findings are in
# .superpowers/go-analysis-report.md.

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused — kept as-is.

  enable:
    # --- Complexity, measured. Both at their tool defaults (30), which is
    # deliberately loose: this pass MEASURES the codebase, it does not decide
    # what complexity is inherent to a CRDT/markdown/websocket core versus
    # accreted. A future assessment does that; until then the gate's job is to
    # stop the count from growing past what's named below, not to shrink it.
    - gocyclo # cyclomatic complexity > 30. 1 standing finding, named below.
    - gocognit # cognitive complexity > 30. 11 standing findings, named below.

    # --- Duplication, measured. dupl's only two findings are twin table-driven
    # tests in internal/markdown/serialize_test.go that assert two different
    # list-nesting rules through the identical harness shape — exactly what a
    # table-driven test looks like when two tables happen to be the same size.
    # Named below so a THIRD one, or a clone anywhere else, still fails.
    - dupl

    # --- Real defect classes with a small, actionable count.
    - errorlint # non-%w fmt.Errorf loses the wrapped error from errors.Is/As.
    - bodyclose # an unclosed http.Response.Body leaks a connection.
    # 3 standing findings across cmd/galley and internal/serve, named below —
    # exactly the class of bug CLAUDE.md's "never pipe a check" entry is about:
    # cheap, easy to miss, expensive once it's a leak in production.
    - unparam # a parameter that's always the same value, or never read.
    # 9 standing findings, named below. Not fixed here — several are test
    # helpers whose signature earns its keep across the whole suite even where
    # one caller doesn't vary the argument; that's a per-finding judgment call
    # for the assessment this report explicitly declines to make.
    - copyloopvar # a `x := x` loop-var copy that Go 1.22's semantics made dead.
    # 32 standing findings, all in _test.go files, named below and heavily
    # concentrated in internal/markdown's table-driven suites (`tc := tc` at
    # the top of nearly every subtest — 17 of the 32 in serialize_test.go
    # alone, one habitual idiom copy-pasted across a big test file). go.mod
    # pins go 1.26, so every one of these is a no-op copy that predates the
    # language change; harmless, and cheap to catch so a NEW one (a real
    # closure-capture bug on an older idiom copied from a neighbour) doesn't
    # slip in beside them.

    # --- Zero-cost today, on-theme with this file's own hazards.
    - nilerr # `if err != nil { return nil }` — silently swallows a real error.
    # 0 findings. Free to enable, and squarely in the territory CLAUDE.md's
    # ledger/CRDT entries warn about: a swallowed error is exactly how "the
    # ledger is memory, never truth" and similar invariants get violated by
    # accident. Enabling it costs nothing today and catches it on day one.
    - rowserrcheck # a sql.Rows loop that never checks rows.Err() after it.
    - gosec
    # 0 findings. internal/ledger is the only database/sql user in the tree;
    # free today, and it is precisely the ledger's own package where a missed
    # partial-scan error would be silent data loss of the kind this repo has
    # already paid for once (see the ledger entries in CLAUDE.md).

  # --- Declined, and why. Each of these was run with --enable-only and
  # produced findings this pass chose not to act on or gate on — see the
  # report for the full list behind every count.
  #
  #   revive        48 findings. The default rule set assumes a package with a
  #                 public API to document: most of the 48 are "exported X
  #                 should have a comment" on internal/-only code (see CLAUDE.md
  #                 — "Everything meaningful is under internal/... there is no
  #                 public Go API surface to design"), which is exactly the
  #                 population that rule exists to police and exactly the
  #                 population this repo doesn't have. A curated revive rule
  #                 list (keep "redefines a builtin", "unused parameter"; drop
  #                 every exported-comment rule) would be worth building, but
  #                 that's a second pass with its own review, not a default
  #                 import.
  #   (gosec is ENABLED — see below. It was first declined on a 137-finding
  #   count taken from a standalone run over test files; through
  #   golangci-lint it is 23, and 12 of those are in _test.go. That is a
  #   population small enough to name, which is this config's whole standard.)
  #
  #   contextcheck  9 findings, all "should pass the context parameter" into
  #                 EditServer.mutate/applyModel. This is a single-process
  #                 local server with no distributed cancellation model —
  #                 nothing downstream of mutate does anything with a ctx if
  #                 one were threaded in, and CLAUDE.md's own concurrency
  #                 entries (the ygo lock hazards, EditServer.mu serializing
  #                 mutations) describe the actual synchronization discipline,
  #                 which is a mutex, not a context tree. Adding ctx params
  #                 with no consumer is churn a linter shouldn't be asking for.
  #   prealloc      5 findings, all micro-allocation suggestions (`var out
  #                 []string` before a small append loop) with no profiling
  #                 evidence any of the five is hot. CLAUDE.md's own discipline
  #                 is measure, then decide (see the diff sweep, the trail's
  #                 TRAIL_SET_CAP numbers) — baking an un-measured perf opinion
  #                 into a correctness gate runs against that.
  #   misspell      2 findings, both the string "teh" in
  #                 internal/review/doc_test.go, which is test data FOR a
  #                 typo-correction test ("an affix on the left rejoins too:
  #                 teh -> the") — the misspelling is the fixture, not a typo.
  #                 Every finding this linter can produce here is a false
  #                 positive on its own test subject; there's nothing left for
  #                 it to catch.
  disable:
    - revive
    - contextcheck
    - prealloc
    - misspell

  exclusions:
    paths:
      # `web/node_modules/flatted/golang/pkg/flatted` is a Go package shipped
      # by an npm TRANSITIVE dependency of the browser linter (flatted, a
      # dependency of eslint) — not code this repository owns or reviews. See
      # `just fmt-check` in the justfile, which excludes the same path for the
      # same reason: a future npm dependency carrying Go source need not be
      # golangci-lint-clean, and `just verify` going red over somebody else's
      # vendored file is a failure nobody could diagnose from its message.
      # `go test -race ./...` gets the matching exclusion in the justfile's
      # `test` recipe, for the identical reason applied to the identical risk.
      - web/node_modules

    # TESTS ARE OUT OF SCOPE FOR THE SECURITY AND STYLE LINTERS, which is the
    # ordinary convention and is worth stating rather than assuming. A test
    # writes fixtures into a temp dir it just created, shells out to a binary
    # it just built, and reads a path it composed itself — every one of those
    # is a finding under gosec's threat model and none of them describes a
    # risk to anybody running galley. `go vet`, `staticcheck` and `errcheck`
    # still cover tests: correctness bugs in a test are real, and a test that
    # silently swallows an error is exactly how a gate stops discriminating.
    # THE RATCHET. Every rule below names ONE standing finding-group this
    # config's own linters produce today, scoped as tightly as golangci-lint's
    # path+text matching allows (by function name, loop-variable name, or —
    # where every finding in a file shares identical text, as errorlint's and
    # bodyclose's do — by file). Clearing a finding and NOT removing its rule
    # here is invisible; clearing it AND removing the rule is how this bound
    # goes down. A new finding anywhere not named below still fails the gate.
    # Full text of every finding these rules suppress is in
    # .superpowers/go-analysis-report.md.
    rules:
      # TESTS ARE OUT OF SCOPE for the security and duplication linters, which
      # is the ordinary convention and is worth stating rather than assuming.
      # A test writes fixtures into a temp dir it just made, shells out to a
      # binary it just built, and reads a path it composed itself — every one
      # of those is a gosec finding and none describes a risk to anybody
      # running galley. Twin table-driven tests sharing a harness shape are
      # dupl's only clone group in 24,753 lines, and that is a test-writing
      # idiom rather than a defect.
      #
      # go vet, staticcheck and errcheck STILL COVER TESTS. Correctness bugs
      # in a test are real, and a test that silently swallows an error is
      # exactly how a gate stops discriminating — this repo has an entry about
      # that costing it a staticcheck finding and a govulncheck failure.
      - path: '_test\.go'
        linters:
          - gosec
          - dupl
          - unparam

      # gosec — 1, and it is the only one left once the rules that describe
      # galley's PURPOSE rather than a risk are excluded above.
      #
      #   internal/serve/versions.go:340  G115 int -> int32
      #
      # `s.lastLanded.Store(int32(r.N))` — a ROUND NUMBER into an atomic
      # int32. r.N counts rounds on one document; reaching 2^31 would mean two
      # billion Revise presses on a single file. The conversion is safe for
      # the same reason the field is an int32 at all, and it is named here
      # rather than silently swept because a reviewer running gosec on this
      # tree should find an answer, not a mystery.
      - path: internal/serve/versions\.go
        linters: [gosec]
        text: "G115"

      # gocyclo — 1
      - path: internal/diff/split\.go
        linters: [gocyclo]
        text: "Blocks` is high"

      # gocognit — 11
      - path: internal/cli/channel\.go
        linters: [gocognit]
        text: "attach` is high"
      - path: internal/cli/channel_test\.go
        linters: [gocognit]
        text: "TestChannelForwardsARevisePress` is high"
      - path: internal/diff/diff\.go
        linters: [gocognit]
        text: "coalesceBlocks` is high"
      - path: internal/diff/render\.go
        linters: [gocognit]
        text: "renderFlow` is high"
      - path: internal/diff/split\.go
        linters: [gocognit]
        text: "Blocks` is high"
      - path: internal/diff/split\.go
        linters: [gocognit]
        text: "Sentences` is high"
      - path: internal/diff/sweep_test\.go
        linters: [gocognit]
        text: "TestSweepTheCorpus` is high"
      - path: internal/markdown/fuzz_test\.go
        linters: [gocognit]
        text: "FuzzRoundTrip` is high"
      - path: internal/review/doc\.go
        linters: [gocognit]
        text: "SetComment` is high"
      - path: internal/serve/applied_test\.go
        linters: [gocognit]
        text: "TestReviseAndLiveSendTheSameRound` is high"
      - path: internal/serve/editmode\.go
        linters: [gocognit]
        text: "handleInstruction` is high"

      # dupl — 2 (one clone pair, both lines named by the finding itself)
      - path: internal/markdown/serialize_test\.go
        linters: [dupl]

      # bodyclose — 3, one per file
      - path: internal/cli/channel_test\.go
        linters: [bodyclose]
      - path: internal/cli/edit\.go
        linters: [bodyclose]
      - path: internal/serve/roomfix_test\.go
        linters: [bodyclose]

      # unparam — 7
      - path: internal/cli/wait_test\.go
        linters: [unparam]
        text: "liveWaitServer"
      - path: internal/markdown/note_test\.go
        linters: [unparam]
        text: "noteAt"
      - path: internal/serve/editwait_test\.go
        linters: [unparam]
        text: "blockedWait"
      - path: internal/serve/serve_test\.go
        linters: [unparam]
        text: "mustAppend"
      - path: internal/serve/versions\.go
        linters: [unparam]
        text: "cutApplied"
      - path: internal/serve/versions\.go
        linters: [unparam]
        text: "recordCannot"
      - path: internal/suggest/suggest_test\.go
        linters: [unparam]
        text: "del - author"

      # copyloopvar — 9
      - path: internal/markdown/critic_test\.go
        linters: [copyloopvar]
        text: 'variable "tc"'
      - path: internal/markdown/critic_test\.go
        linters: [copyloopvar]
        text: 'variable "src"'
      - path: internal/markdown/serialize_test\.go
        linters: [copyloopvar]
        text: 'variable "f"'
      - path: internal/markdown/serialize_test\.go
        linters: [copyloopvar]
        text: 'variable "src"'
      - path: internal/markdown/serialize_test\.go
        linters: [copyloopvar]
        text: 'variable "repeats"'
      - path: internal/markdown/serialize_test\.go
        linters: [copyloopvar]
        text: 'variable "want"'
      - path: internal/markdown/serialize_test\.go
        linters: [copyloopvar]
        text: 'variable "tc"'
      - path: internal/markdown/legal_test\.go
        linters: [copyloopvar]
        text: 'variable "tc"'
      - path: internal/markdown/parse_test\.go
        linters: [copyloopvar]
        text: 'variable "tc"'

  settings:
    gosec:
      # EXCLUDED BY RULE, NOT BY DECLINING THE LINTER. gosec's threat model is a
      # network service parsing untrusted input. galley is a local CLI whose job
      # includes shelling out to git and writing files the invoking user already
      # owns, so several of its rules describe galley's PURPOSE rather than a
      # risk. Naming them beats not running it: a reviewer who runs gosec
      # themselves gets an answer here instead of 23 unexplained findings.
      excludes:
        # Subprocess with variable arguments. galley runs the shell command the
        # invoking user typed (--on-comment, --on-revise in internal/serve) and
        # opens URLs in their browser by design. There is no privilege boundary
        # crossed.
        - G204
        # Directory and file permission opinions (0750/0600). galley writes the
        # sidecar, the ledger and the projection as the user who invoked it,
        # into paths that user named. 0644 is correct for files a person is
        # meant to open in their own editor.
        - G301
        - G302
        - G306
        # "File inclusion via variable" and path traversal on a path the user
        # typed on their own command line. The taint source is argv.
        - G304
        - G703

    gocyclo:
      min-complexity: 30 # the linter's own default — see the `enable` comment.
    gocognit:
      min-complexity: 30 # ditto.
